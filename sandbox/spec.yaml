schemaVersion: "2"
kind: sandbox
name: privacy-search-lab
description: Local document retrieval with OpenCode and no cloud credentials
sandbox:
  # The -docker template is required for the private Docker daemon/socket used
  # by Compose inside the microVM. The plain opencode image has only the CLI.
  image: docker/sandbox-templates:opencode-docker@sha256:d23d51e1eaa7c23db723b3cd547fc998829b5c147579c512c7222efd30761fdd
  entrypoint: [opencode]
environment:
  variables:
    LAB_OLLAMA_OPENAI_URL: http://host.docker.internal:11435/v1
    OPENCODE_DISABLE_AUTOUPDATE: "true"
    OPENCODE_DISABLE_MODELS_FETCH: "true"
    OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
    OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
    OPENCODE_DISABLE_CLAUDE_CODE: "true"
permissions:
  network:
    allow:
      - localhost:11435
